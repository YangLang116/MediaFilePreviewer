<!DOCTYPE html>
<html lang="en">
<head>
    <title>SVGA-PREVIEW</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <style>{style_placeholder}</style>
    <script>{script_placeholder}</script>
</head>
<body onload="onPageLoad()">
<div id="opera-block">
    <div class="spacer"></div>
    <div id="more_info" onclick="showMoreInfo(this)">Dev: Off</div>
    <div class="item" id="color-black" onclick="switchColor(this)"></div>
    <div class="item" id="color-white" onclick="switchColor(this)"></div>
    <div class="item" id="color-blue" onclick="switchColor(this)"></div>
    <div class="item" id="color-green" onclick="switchColor(this)"></div>
    <div class="item" id="color-yellow" onclick="switchColor(this)"></div>
    <div class="item" id="color-red" onclick="switchColor(this)"></div>
</div>
<div id="content">
    <div id="canvas-container">
        <div id="canvas"></div>
    </div>
    <div id="info-container">
        <div class="info-area">
            <div class="info-title">File Info</div>
            <ul class="info-list">
                <li class="info-item" id="version_info">Version: -</li>
                <li class="info-item" id="fps_info">FPS: -</li>
                <li class="info-item" id="frame_info">Frames: -</li>
                <li class="info-item" id="duration_info">Duration: -</li>
                <li class="info-item" id="dimension_info">Dimension: -</li>
                <li class="info-item" id="memory_info">Memory: -</li>
                <li class="info-item" id="size_info">Size: {file_Size}</li>
            </ul>
        </div>
        <div class="info-area">
            <div class="info-title">Images Info</div>
            <ul class="info-list" id="image-info-list"></ul>
        </div>
    </div>
</div>
</body>
</html>
