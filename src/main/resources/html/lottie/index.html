<!DOCTYPE html>
<html lang="en">
<head>
    <title>LOTTIE-PREVIEW</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <style>{style_placeholder}</style>
    <script>{script_placeholder}</script>
</head>
<body onload="onPageLoad()">
<div id="opera-block">
    <div class="spacer"></div>
    <div class="info-item" id="version_info">Version: -</div>
    <div class="info-item" id="frame_info">Frames: -</div>
    <div class="info-item" id="size_info">Size: -</div>
    <div class="item" id="color-black" onclick="switchColor(this)"></div>
    <div class="item" id="color-white" onclick="switchColor(this)"></div>
    <div class="item" id="color-blue" onclick="switchColor(this)"></div>
    <div class="item" id="color-green" onclick="switchColor(this)"></div>
    <div class="item" id="color-yellow" onclick="switchColor(this)"></div>
    <div class="item" id="color-red" onclick="switchColor(this)"></div>
</div>
<div id="content">
    <div id="canvas-container">
        <div id="canvas"></div>
    </div>
</div>
</body>
</html>
